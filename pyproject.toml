[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-bot"
version = "0.1.0"
description = "A small NoneBot2 bot connected to NapCatQQ through OneBot v11."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "nonebot2[fastapi]>=2.4,<3",
    "nonebot-adapter-onebot>=2.4,<3",
    "python-dotenv>=1,<2",
    "tzdata>=2025.2",
    "openai-codex==0.162.1",
    "markdown-it-py>=3,<5",
    "mdit-py-plugins>=0.5,<1",
    "playwright>=1.50,<2",
    "paramiko>=3.5,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[project.scripts]
qq-bot = "bot.__main__:main"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
bot = ["ai/skills/main/SKILL.md"]
